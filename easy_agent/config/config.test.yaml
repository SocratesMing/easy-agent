# ===== 测试环境配置 =====

# 前端空闲自动登出（分钟）：用户超过该时长无操作则退出到登录页；设为 0 禁用
idle_logout_minutes: 5   # 前端空闲自动登出（分钟）：用户超过该时长无界面操作或后端交互则退出到登录页；设为 0 禁用
model: "deepseek"

models:
  deepseek:
    provider: "deepseek"
    protocol: "openai"
    model: "deepseek-v4-flash"
    api_key: "${DEEPSEEK_API_KEY}"
    api_base: "https://api.deepseek.com"
    max_input_tokens: 200000

# Retry
retry:
  enabled: true
  max_retries: 2

# Agent
max_steps: 50
workspace_dir: "./workspace"
memories_dir: "./memories"
# 日志目录 / 文件名 / 格式 / 级别（级别默认 info；EASY_LOG_DIR 可覆盖 dir）
log:
  dir: ./logs
  file: ""
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  level: info
sessions_dir: "./sessions"     # 会话数据存储目录（项目相对路径）
system_prompt_path: "system_prompt.md"  # System prompt file (same config directory)
system_prompt_path: "system_prompt.md"

# 外部目录映射：虚拟路径前缀 → 宿主机实际路径
# external_dirs:
#   "/strategy-workspace": "/home/sututu/code/finance-skills/fast_backtest/workspace"
external_dirs: {}

# Summarization
summarization:
  enabled: true
  compression_threshold: 0.8
  compression_target: 0.1

# Tools
tools:
  result_log_truncate: 200
  skills_dir: "./skills"
  prompts_dir: "./prompts"
  read_file_line_limit: 2000

# Preset Questions
preset_questions:
  - category: "文档处理"
    icon: "📄"
    questions:
      - "帮我创建一份智能体介绍的docx,ppt和pdf文件"
      - "帮我生成一份金融量化的pptx"
      - "总结这份PDF的核心要点"
  - category: "量化策略"
    icon: "📈"
    questions:
      - "帮我生成一个策略如下： 1、交易货币：EUR/USD， 2、周期：采用1小时图作为主信号周期， 3、核心指标包括：集合EMA(20)、MACD指实现入开仓； 4、止盈止损：止盈采用固定40点，止损采用固定100点。 5、持仓时间：无限制 6、回测区间 2021-01-01 至 2021-03-31 不需要回测，生成策略即可"
      - "解释一下什么是动量策略"
      - "帮我写一个双均线交叉策略"
  - category: "信息查询"
    icon: "🔍"
    questions:
      - "今天A股哪些板块比较强势？"
      - "帮我查一下贵州茅台的最新财报"
      - "解释一下MACD指标的原理"

# Database - 测试环境使用 MySQL（可降级为 SQLite）
database:
  type: "mysql"
  sqlite:
    path: "./data/easy_agent_test.db"
  mysql:
    host: "${MYSQL_HOST:-127.0.0.1}"
    port: 3306
    user: "${MYSQL_USER:-root}"
    password: "${MYSQL_PASSWORD}"
    database: "${MYSQL_DATABASE:-agent_test}"
    charset: "utf8mb4"
    pool:
      pool_size: 3
      max_overflow: 5
      pool_timeout: 30
      pool_recycle: 3600
    connect_timeout: 10
    read_timeout: 30
    write_timeout: 30

# Vector Store
# 禁止智能体读写的虚拟路径目录列表（通过 permissions deny 规则限制）
# 支持两种格式：
#   - 字符串："/strategy-workspace"                       → 默认禁止 read+write
#   - 字典：  {path: "/user-skills", operations: ["write"]} → 只禁止指定操作
# operations 可选值：read、write。user-skills 建议只禁止 write，
# 允许模型读取 SKILL.md 和 reference 文件以正常使用技能。
denied_dirs:
  - path: "/user-skills"
    operations: ["write"]
