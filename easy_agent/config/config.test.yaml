# ===== 测试环境配置 =====

# LLM Configuration
model: "deepseek"

models:
  deepseek:
    provider: "deepseek"
    protocol: "openai"
    model: "deepseek-v4-flash"
    api_key: "${DEEPSEEK_API_KEY}"
    api_base: "https://api.deepseek.com"
    max_input_tokens: 200000

# Retry
retry:
  enabled: true
  max_retries: 2

# Agent
max_steps: 50
workspace_dir: "./workspace"
memories_dir: "./memories"
log_dir: "./logs"             # 日志文件目录（项目相对路径）
sessions_dir: "./sessions"     # 会话数据存储目录（项目相对路径）
system_prompt_path: "system_prompt.md"  # System prompt file (same config directory)
system_prompt_path: "system_prompt.md"

# 外部目录映射：虚拟路径前缀 → 宿主机实际路径
# external_dirs:
#   "/strategy-workspace": "/home/sututu/code/finance-skills/fast_backtest/workspace"
external_dirs: {}

# Summarization
summarization:
  enabled: true
  compression_threshold: 0.8
  compression_target: 0.1

# Tools
tools:
  result_log_truncate: 200
  skills_dir: "./skills"
  prompts_dir: "./prompts"
  read_file_line_limit: 2000

# Preset Questions
preset_questions:
  - "测试问题1"
  - "测试问题2"

# Database - 测试环境使用 MySQL（可降级为 SQLite）
database:
  type: "mysql"
  sqlite:
    path: "./data/easy_agent_test.db"
  mysql:
    host: "${MYSQL_HOST:-127.0.0.1}"
    port: 3306
    user: "${MYSQL_USER:-root}"
    password: "${MYSQL_PASSWORD}"
    database: "${MYSQL_DATABASE:-agent_test}"
    charset: "utf8mb4"
    pool:
      pool_size: 3
      max_overflow: 5
      pool_timeout: 30
      pool_recycle: 3600
    connect_timeout: 10
    read_timeout: 30
    write_timeout: 30

# Vector Store
# 禁止智能体读写的虚拟路径目录列表（通过 permissions deny 规则限制）
# 支持两种格式：
#   - 字符串："/strategy-workspace"                       → 默认禁止 read+write
#   - 字典：  {path: "/user-skills", operations: ["write"]} → 只禁止指定操作
# operations 可选值：read、write。user-skills 建议只禁止 write，
# 允许模型读取 SKILL.md 和 reference 文件以正常使用技能。
denied_dirs:
  - path: "/user-skills"
    operations: ["write"]
