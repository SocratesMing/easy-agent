# Easy Agent 配置模板：复制为 config.yaml。
# 环境差异用 ${VAR:-默认值} 占位符从 .env.{AGENT_ENV}（dev/test/prod，缺省回退 .env）注入，默认值即开发环境取值。
# 敏感值（api_key / password）只写 .env。备用配置：EASY_CONFIG=/path/to/xxx.yaml。
# 校验：python scripts/quality/check_config_schema.py --check

# ===== LLM =====
model: "${ACTIVE_MODEL:-deepseek}"   # 当前模型：deepseek | qwen | ark

models:
  deepseek:
    provider: "deepseek"
    protocol: "openai"                # openai | anthropic
    model: "${DEEPSEEK_MODEL:-deepseek-v4-pro-0813}"
    api_key: "${DEEPSEEK_API_KEY}"
    api_base: "${DEEPSEEK_API_BASE:-https://llm-tyyt06c5mq54ngq7.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}"
    context_length: ${DEEPSEEK_CONTEXT_LENGTH:-131072}
    headers: {}                       # 可选透传请求头，值支持 {session_id} 占位符

  qwen:
    provider: "qwen"
    protocol: "openai"                # openai | anthropic
    model: "${QWEN_MODEL:-qwen-plus}"
    api_key: "${QWEN_API_KEY}"
    api_base: "${QWEN_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
    context_length: ${QWEN_CONTEXT_LENGTH:-131072}

  ark:
    provider: "ark"
    protocol: "openai"                # openai | anthropic
    model: "${ARK_MODEL:-ark-code-latest}"
    api_key: "${ARK_API_KEY}"
    api_base: "https://ark.cn-beijing.volces.com/api/coding/v3"
    context_length: ${ARK_CONTEXT_LENGTH:-200000}

# ===== 重试 =====
retry:
  enabled: true           # 是否启用重试
  max_retries: 3          # 最大重试次数

# ===== Agent =====
max_steps: ${MAX_STEPS:-100}                      # 单轮最大执行步数
workspace_dir: "${WORKSPACE_DIR:-/qts/workspace}" # 工作区根目录，实际按用户/会话隔离
memories_dir: "${MEMORIES_DIR:-/qts/memories}"    # 长期记忆根目录，实际 {memories_dir}/{username}/AGENTS.md
sessions_dir: "${SESSIONS_DIR:-/qts/sessions}"    # 会话数据目录，实际 {sessions_dir}/{username}/{session_id}.json
prompt_path: "prompts"                            # 提示词目录（相对配置目录）
idle_logout_minutes: ${IDLE_LOGOUT_MINUTES:-0}    # 前端空闲登出分钟数，0 = 不登出
app_welcome_title: "今天，你要研究什么"            # 首页欢迎语
sandbox_enabled: ${SANDBOX_ENABLED:-true}         # 启用 bwrap/Landlock 沙箱；无沙箱平台拒绝 execute
sandbox_network: ${SANDBOX_NETWORK:-host}         # 沙箱网络：host = 可联网 / none = 断网（Landlock 模式降级为告警）
execute_max_timeout: ${EXECUTE_MAX_TIMEOUT:-600}  # execute 可指定的最长超时（秒）
session_thread: ${SESSION_THREAD:-true}           # 一会话一 thread（需 checkpointer）；false = 每条消息重建历史（兼容模式）

# 外部目录映射：虚拟路径 → 宿主机路径（供技能访问）
external_dirs:
  "/strategy-workspace": "${STRATEGY_WORKSPACE:-/qts/workspace}"

# ===== 上下文压缩 =====
summarization:
  enabled: true                    # false = 关闭压缩与参数截断（阈值抬到不可达）
  compression_threshold: 0.8       # 上下文用量达到该比例时压缩
  compression_target: 0.1          # 压缩后保留的上下文比例

# ===== 工具 =====
tools:
  result_log_truncate: 200                        # 工具结果在日志中的截断字符数
  skills_dir: "${SKILLS_DIR:-./skills}"           # 公共技能目录
  prompts_dir: "${PROMPTS_DIR:-/qts/prompts}"     # 提示词目录（外汇等技能使用）
  experts_dir: "${EXPERTS_DIR:-./experts}"        # 预置专家目录（只读扫描）

# ===== 联网搜索 =====
web_search:
  enabled: ${WEB_SEARCH_ENABLED:-true}                        # 是否启用；api_key 为空时前端置灰
  provider: "${WEB_SEARCH_PROVIDER:-tavily}"                  # tavily | internal
  api_url: "${WEB_SEARCH_API_URL:-}"                          # 留空用 provider 默认地址
  api_key: "${WEB_SEARCH_API_KEY}"                            # tavily 在 app.tavily.com 申请（tvly- 开头）
  search_depth: "${WEB_SEARCH_SEARCH_DEPTH:-basic}"           # 仅 tavily：basic | advanced | fast | ultra-fast
  topic: "${WEB_SEARCH_TOPIC:-general}"                       # 仅 tavily：general | news | finance
  timeout_seconds: ${WEB_SEARCH_TIMEOUT:-30}                  # 请求超时（秒）
  default_time_range: "${WEB_SEARCH_TIME_RANGE:-NoLimit}"     # NoLimit | OneDay | OneWeek | OneMonth | OneYear | YYYY-MM-DD..YYYY-MM-DD
  max_results: ${WEB_SEARCH_MAX_RESULTS:-10}                  # 每次返回条数（tavily 上限 20）
  main_text_max_chars: ${WEB_SEARCH_MAIN_TEXT_CHARS:-500}     # 单条结果摘要字符上限

# ===== 首页预置问题（每条一张卡片，最多 6 张）=====
preset_questions:
  - category: "宏观与资产研判"
    icon: "❄️"
    questions:
      - "结合国内外宏观指标判断增长与通胀方向，再落到 10 年期国债给出趋势研判与验证信号。"
  - category: "大类配置"
    icon: "📊"
    questions:
      - "基于最新 CMA 与当前持仓，在 PVBP、RWA 与分中心久期约束下测算目标持仓与约束。"
  - category: "组合管理"
    icon: "📄"
    questions:
      - "按信评、行业、期限、流动性与地域穿透信用债投组，标出久期集中区间与低流动性资产占比。"
  - category: "策略工坊"
    icon: "💻"
    questions:
      - "参考 XBOND 最优报价与经纪商跟随策略，新建一个债券日内做市策略并给出回测与验证方案。"
  - category: "因子工坊"
    icon: "📈"
    questions:
      - "围绕资金面、期限利差与机构行为挖掘利率债择时因子，并说明检验标准。"
  - category: "数据底座"
    icon: "🗄️"
    questions:
      - "调 USDCNH 近一周分钟 bar，算 5 分钟已实现波动率，并说明数据渠道与更新时点。"

# ===== 数据库 =====
database:
  type: "${DB_TYPE:-mysql}"                         # sqlite | mysql

  sqlite:
    path: "${SQLITE_PATH:-/qts/data/easy_agent.db}" # SQLite 文件路径

  mysql:
    host: "${MYSQL_HOST:-127.0.0.1}"
    port: ${MYSQL_PORT:-3306}
    user: "${MYSQL_USER:-root}"
    password: "${MYSQL_PASSWORD}"
    database: "${MYSQL_DATABASE:-easy_agent}"
    charset: "utf8mb4"
    pool:
      pool_size: ${MYSQL_POOL_SIZE:-5}    # 常驻连接数
      max_overflow: 10                    # 超出 pool_size 的临时连接数
      pool_recycle: 3600                  # 连接复用次数上限（DBUtils maxusage，非秒）
    connect_timeout: 10                   # 建立连接超时（秒）
    read_timeout: 30                      # 读超时（秒）
    write_timeout: 30                     # 写超时（秒）

# ===== 人员账号 =====
personnel:
  self_registration_enabled: false   # 自助注册：true 时登录页显示注册入口
  passwordless_login_enabled: false  # 门户免密登录：true 时支持 URL 直登与 /login-passwordless（admin 不支持）

# ===== 分布式锁（多实例部署）=====
distributed_lock:
  enabled: ${DISTRIBUTED_LOCK_ENABLED:-false}                  # 多 pod/多 worker 时开启，避免定时任务重复执行
  key_prefix: "${DISTRIBUTED_LOCK_KEY_PREFIX:-easy_agent}"     # 多套系统共库时用于区分
  ttl_seconds: ${DISTRIBUTED_LOCK_TTL:-300}                    # 锁存活时间（秒），持有者崩溃后最多等这么久
  renew_interval_seconds: ${DISTRIBUTED_LOCK_RENEW_INTERVAL:-100}  # 长任务续约间隔（秒），实际取 min(本值, ttl/3)
  retry_interval_seconds: ${DISTRIBUTED_LOCK_RETRY_INTERVAL:-1}    # 抢锁轮询间隔（秒）

# ===== 文件权限 =====
skill_write: ${SKILL_WRITE:-new-only}  # 技能库写权限：new-only（只可新建）| deny（全禁写）| allow（不限制）
interrupt_sensitive_writes: true       # /memories/**、/user-skills/** 的写入是否走人工审批（需 checkpointer）
denied_dirs: []                        # 禁读写的虚拟路径；字符串 = 读+写，{path, operations} = 仅指定操作

# ===== 专家 =====
expert:
  guardrail_enabled: true            # 在专家提示词末尾追加职责边界
  relevance_check_enabled: true      # 每轮预检相关性，无关消息直接拒答
  relevance_strict: false            # true = 部分相关也整条拒答；false = 放行只答相关部分
  relevance_disable_thinking: true   # 预检调用关闭思考模式

# ===== 专家分类标签（tag_id 落库，tag_name 展示）=====
expert_tags:
  - { tag_id: macro_research, tag_name: 宏观投研 }
  - { tag_id: bond_research, tag_name: 债券投研 }
  - { tag_id: fx_research, tag_name: 外汇投研 }
  - { tag_id: gold_research, tag_name: 黄金投研 }
  - { tag_id: alm_calc, tag_name: 资负测算 }
  - { tag_id: strategy_research, tag_name: 策略研究 }
  - { tag_id: factor_analysis, tag_name: 因子分析 }
  - { tag_id: equity_research, tag_name: 权益投研 }
  - { tag_id: industry_research, tag_name: 行业研究 }
  - { tag_id: credit_research, tag_name: 信用研究 }
  - { tag_id: asset_allocation, tag_name: 资产配置 }
  - { tag_id: risk_management, tag_name: 风险管理 }
  - { tag_id: other, tag_name: 其他 }

# ===== 附件上传限额（单个会话单次对话）=====
upload_limits:
  enabled: ${UPLOAD_LIMITS_ENABLED:-true}            # false = 不限制
  max_file_size_mb: ${UPLOAD_MAX_FILE_SIZE_MB:-10}   # 单文件上限
  max_files_per_message: ${UPLOAD_MAX_FILES:-5}      # 单次数量上限
  max_total_size_mb: ${UPLOAD_MAX_TOTAL_SIZE_MB:-20} # 单次总大小上限（>100 需同步 nginx client_max_body_size）

# ===== 上传文件解析与记忆（file_context）=====
file_context:
  enabled: ${FILE_CONTEXT_ENABLED:-true}                     # false = 回退全量注入
  parse_max_file_size_mb: ${FILE_PARSE_MAX_MB:-20}           # 超过该大小不解析，仍记清单
  max_stored_chars: ${FILE_MAX_STORED_CHARS:-200000}         # 单文件落盘文本上限（字符）
  manifest_max_chars: ${FILE_MANIFEST_MAX_CHARS:-2000}       # 上传清单上限，超出丢最旧条目
  preview_max_chars: ${FILE_PREVIEW_MAX_CHARS:-2000}         # 本轮预览注入上限（0 = 不注入）

# ===== 知识库 / RAGFlow =====
knowledge:
  enabled: ${KNOWLEDGE_ENABLED:-false}                   # 启用前需配置 RAGFLOW_BASE_URL / RAGFLOW_API_KEY
  base_url: "${RAGFLOW_BASE_URL}"
  api_key: "${RAGFLOW_API_KEY}"
  shared_dataset_id: "${RAGFLOW_SHARED_DATASET_ID:-}"    # 留空按 EA_SHARED 名称查找或创建
  embedding:
    model: "${RAGFLOW_EMBEDDING_MODEL:-}"                # 留空用 RAGFlow 默认 embedding
  audit:
    enabled: true                                        # 记录知识库审计事件
    max_details_bytes: 4096                              # 事件 details 截断上限
  limits:
    max_file_size_mb: 100                                # 单文件大小上限
    max_request_size_mb: 110                             # 单请求大小上限
    max_files_per_request: 1                             # 单请求文件数上限
    max_filename_utf8_bytes: 127                         # 文件名 UTF-8 字节上限
    allowed_extensions: [pdf, doc, docx, txt, md, xls, xlsx, csv, ppt, pptx]  # 允许的扩展名
    max_documents_per_query: 500                         # 单次查询文档数上限
  # 外部目录树同步（默认关闭，按需取消注释）
