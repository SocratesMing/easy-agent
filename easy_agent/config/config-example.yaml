# Easy Agent Configuration (Example)
#
# Copy this file to config.yaml and fill in your API keys via environment variables,
# or replace the ${...} placeholders with actual values.
#
# Configuration File Locations (in priority order):
# 1) easy_agent/config/config.yaml - Development mode (current directory)
# 2) ~/.easy-agent/config/config.yaml - User config directory
# 3) <package>/easy_agent/config/config.yaml - Package installation directory
#
# Sensitive values (api_key, password, ...) use ${ENV_VAR} placeholders and are
# resolved at load time from os.environ. The project-root .env file is loaded
# automatically before the config is parsed, so it is enough to write:
#   MYSQL_PASSWORD=...
#   DEEPSEEK_API_KEY=...
# Optional ${VAR:-default} syntax is also supported.
# 未取到值且无默认值的变量按空串处理，变量名会在启动日志中 WARNING 列出。

# ===== LLM Configuration =====
# Select which model to use: minimax | deepseek
model: "deepseek"

# Provider-specific configurations
models:

  deepseek:
    provider: "deepseek"
    protocol: "openai"  # anthropic or openai
    model: "deepseek-v4-flash"
    api_key: "${DEEPSEEK_API_KEY}"
    api_base: "https://api.deepseek.com"
    max_input_tokens: 200000

  ark:
    provider: "ark"
    protocol: "openai"  # anthropic or openai
    model: "deepseek-v4-pro"
    api_key: "${ARK_API_KEY}"
    api_base: "https://ark.cn-beijing.volces.com/api/coding/v3"
    max_input_tokens: 200000


# ===== Retry Configuration =====
retry:
  enabled: true           # Enable retry mechanism
  max_retries: 3          # Maximum number of retries

# ===== Agent Configuration =====
max_steps: 100  # Maximum execution steps
workspace_dir: "/qts/workspace"  # Working directory (project-relative). 实际路径会按用户/会话隔离：{workspace_dir}/{username}/{session_dir}
memories_dir: "./memories"    # Long-term memory directory (project-relative). 实际路径：{memories_dir}/{username}/AGENTS.md
sessions_dir: "./sessions"     # 会话数据存储目录（项目相对路径）。实际路径：{sessions_dir}/{username}/{session_id}.json
# 提示词目录：优先读取 <本目录>/prompts/system.md + prompts/fragments/*.md，
# 不存在时才回落到下面这个单文件（兼容旧配置），两者都没有则使用内置默认提示词。
# 也可用环境变量 EASY_PROMPTS_DIR 指向外部提示词目录（便于 ConfigMap 挂载覆盖）。
system_prompt_path: "system_prompt.md"  # System prompt file (same config directory, legacy fallback)
idle_logout_minutes: 0   # 前端空闲自动登出（分钟）：用户超过该时长无界面操作或后端交互则退出到登录页；0 表示永不过期（默认，后台不启用登录超时机制）
app_welcome_title: "Easy Agent，让工作更简单"  # 首页欢迎语
sandbox_enabled: true    # Linux 使用 bwrap/Landlock；Windows 无等效沙箱时拒绝 execute。仅在可信单用户环境设为 false

# 外部目录映射：虚拟路径前缀 → 宿主机实际路径
# 将 skill 需要访问的宿主机目录挂载为虚拟路径路由，使文件工具能通过虚拟路径访问
external_dirs:
  "/strategy-workspace": "/home/sututu/code/finance-skills/fast_backtest/workspace"

# ===== Summarization Configuration =====
# Auto-compress conversation context when token usage exceeds threshold
summarization:
  enabled: true                    # Enable context compression
  compression_threshold: 0.8       # Trigger compression at 80% of context window
  compression_target: 0.1          # Keep 10% of context window after compression

# ===== Tools Configuration =====
tools:
  result_log_truncate: 200  # 工具结果在日志中的截断字符数（默认 200）
  skills_dir: "./skills"   # Skills directory path
  prompts_dir: "./prompts" # Prompts directory path
  read_file_line_limit: 2000  # read_file 内置工具每次读取的行数（默认 2000）

# ===== Preset Questions =====
# Quick action questions shown on the welcome screen
preset_questions:
  - category: "文档处理"
    icon: "📄"
    questions:
      - "帮我创建一份智能体介绍的docx,ppt和pdf文件"
      - "帮我生成一份金融量化的pptx"
      - "总结这份PDF的核心要点"
  - category: "量化策略"
    icon: "📈"
    questions:
      - "帮我生成一个策略如下： 1、交易货币：EUR/USD， 2、周期：采用1小时图作为主信号周期， 3、核心指标包括：集合EMA(20)、MACD指实现入开仓； 4、止盈止损：止盈采用固定40点，止损采用固定100点。 5、持仓时间：无限制 6、回测区间 2021-01-01 至 2021-03-31 不需要回测，生成策略即可"
      - "解释一下什么是动量策略"
      - "帮我写一个双均线交叉策略"
  - category: "信息查询"
    icon: "🔍"
    questions:
      - "今天A股哪些板块比较强势？"
      - "帮我查一下贵州茅台的最新财报"
      - "解释一下MACD指标的原理"

# ===== Database Configuration =====
# Supports SQLite (local) or MySQL (remote)
database:
  type: "mysql"

  sqlite:
    path: "./data/easy_agent.db"

  mysql:
    host: "${MYSQL_HOST:-127.0.0.1}"
    port: ${MYSQL_PORT:-3306}
    user: "${MYSQL_USER:-root}"
    password: "${MYSQL_PASSWORD}"
    database: "${MYSQL_DATABASE:-easy_agent}"
    charset: "utf8mb4"
    pool:
      pool_size: 5
      max_overflow: 10
      pool_timeout: 30
      pool_recycle: 3600
    connect_timeout: 10
    read_timeout: 30
    write_timeout: 30

# ===== Vector Store Configuration (Chroma + Sentence Transformers) =====
# 禁止智能体读写的虚拟路径目录列表（通过 permissions deny 规则限制）
# 路径必须是虚拟路径（以 / 开头），且必须是 CompositeBackend 已挂载的 route 前缀。
# 系统会自动为路径补充 /** glob 通配符递归匹配子目录。
# 支持两种格式：
#   - 字符串："/strategy-workspace"                       → 默认禁止 read+write
#   - 字典：  {path: "/user-skills", operations: ["write"]} → 只禁止指定操作
# operations 可选值：read、write。user-skills 建议只禁止 write，
# 允许模型读取 SKILL.md 和 reference 文件以正常使用技能。
denied_dirs:
  - path: "/user-skills"
    operations: ["write"]
