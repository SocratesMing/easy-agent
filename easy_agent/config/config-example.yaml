# Easy Agent 配置模板：复制为 config.yaml。
# 环境差异用 ${VAR:-默认值} 占位符从 .env.{AGENT_ENV}（dev/test/prod，缺省回退 .env）注入，默认值即开发环境取值。
# 敏感值（api_key / password）只写 .env。备用配置：EASY_CONFIG=/path/to/xxx.yaml。
# 校验：python scripts/quality/check_config_schema.py --check

# ===== LLM =====
model: "${ACTIVE_MODEL:-deepseek}"   # 当前模型：deepseek

models:
  deepseek:
    provider: "deepseek"
    protocol: "openai"                # 目前只支持 openai（OpenAI 兼容接口）
    model: "${DEEPSEEK_MODEL:-deepseek-v4-pro-0813}"
    api_key: "${DEEPSEEK_API_KEY}"
    api_base: "${DEEPSEEK_API_BASE:-https://llm-tyyt06c5mq54ngq7.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}"
    context_length: ${DEEPSEEK_CONTEXT_LENGTH:-131072}
    headers: {}                       # 可选透传请求头，值支持 {session_id} 占位符

# ===== 重试 =====
retry:
  enabled: true           # 是否启用重试
  max_retries: 3          # 最大重试次数

# ===== 流式响应（SSE）=====
streaming:
  # 空闲心跳间隔（秒）：流上超过该时长没有事件时补一帧 SSE 注释行（: keep-alive），
  # 防止反向代理（nginx 默认 proxy_read_timeout 60s）按「上游静默」掐断连接
  # （表现为浏览器 ERR_INCOMPLETE_CHUNKED_ENCODING 200 / 前端 network error）。
  # 须小于反向代理读超时；<= 0 关闭心跳。心跳不是事件，不落库、前端自动忽略。
  sse_heartbeat_seconds: ${EASY_SSE_HEARTBEAT_SECONDS:-15}

# ===== Agent =====
max_steps: ${MAX_STEPS:-100}                      # 单轮最大执行步数
tool_progress_enabled: ${TOOL_PROGRESS_ENABLED:-true}  # 工具空结果终止提示 + 原地打转提醒（只改结果文本，不改工具行为）
tool_progress_empty_limit: ${TOOL_PROGRESS_EMPTY_LIMIT:-3}      # MCP 同一目标连续空结果到几次要求停止（仅在从未取到过数据时生效）
tool_progress_converge_limit: ${TOOL_PROGRESS_CONVERGE_LIMIT:-8}  # MCP 同工具连续「无进展」到几次提示收敛（分页取数不计入）
tool_progress_stop_limit: ${TOOL_PROGRESS_STOP_LIMIT:-12}        # MCP 同工具连续「无进展」到几次要求停机并输出数据质量报告
tool_progress_empty_hard_limit: ${TOOL_PROGRESS_EMPTY_HARD_LIMIT:-9}  # MCP 同工具连续空结果到几次无条件止损（兜「先查到 A 又反复查 B」的场景）
workspace_dir: "${WORKSPACE_DIR:-/qts/workspace}" # 工作区根目录，实际按用户/会话隔离
memories_dir: "${MEMORIES_DIR:-/qts/memories}"    # 长期记忆根目录，实际 {memories_dir}/{username}/AGENTS.md
memory_model: ""                                  # 整理记忆用的模型（models 里的键），留空 = 用会话的对话模型；建议配一个便宜、快的
sessions_dir: "${SESSIONS_DIR:-/qts/sessions}"    # 会话数据目录，实际 {sessions_dir}/{username}/{session_id}.json
prompt_path: "prompts"                            # 提示词目录（相对配置目录）
idle_logout_minutes: ${IDLE_LOGOUT_MINUTES:-0}    # 前端空闲登出分钟数，0 = 不登出
app_welcome_title: "今天，你要研究什么"            # 首页欢迎语
sandbox_enabled: ${SANDBOX_ENABLED:-true}         # 启用 bwrap/Landlock 沙箱；无沙箱平台拒绝 execute
sandbox_network: ${SANDBOX_NETWORK:-host}         # 沙箱网络：host = 可联网 / none = 断网（Landlock 模式降级为告警）
execute_max_timeout: ${EXECUTE_MAX_TIMEOUT:-600}  # execute 可指定的最长超时（秒）
session_thread: ${SESSION_THREAD:-true}           # 一会话一 thread（需 checkpointer）；false = 每条消息重建历史（兼容模式）

# 外部目录映射：虚拟路径 → 宿主机路径（供技能访问）
external_dirs:
  "/strategy-workspace": "${STRATEGY_WORKSPACE:-/qts/workspace}"

# ===== 上下文压缩 =====
summarization:
  enabled: true                    # false = 关闭压缩与参数截断（阈值抬到不可达）
  compression_threshold: 0.8       # 上下文用量达到该比例时压缩
  compression_target: 0.1          # 压缩后保留的上下文比例

# ===== 工具 =====
tools:
  result_log_truncate: 200                        # 工具结果在日志中的截断字符数
  skills_dir: "${SKILLS_DIR:-./skills}"           # 公共技能目录
  prompts_dir: "${PROMPTS_DIR:-/qts/prompts}"     # 提示词目录（外汇等技能使用）
  experts_dir: "${EXPERTS_DIR:-./experts}"        # 预置专家目录（只读扫描）

# ===== 联网搜索 =====
web_search:
  enabled: ${WEB_SEARCH_ENABLED:-true}                        # 是否启用；api_key 为空时前端置灰
  provider: "${WEB_SEARCH_PROVIDER:-tavily}"                  # tavily | internal
  api_url: "${WEB_SEARCH_API_URL:-}"                          # 留空用 provider 默认地址
  api_key: "${WEB_SEARCH_API_KEY}"                            # tavily 在 app.tavily.com 申请（tvly- 开头）
  search_depth: "${WEB_SEARCH_SEARCH_DEPTH:-basic}"           # 仅 tavily：basic | advanced | fast | ultra-fast
  topic: "${WEB_SEARCH_TOPIC:-general}"                       # 仅 tavily：general | news | finance
  timeout_seconds: ${WEB_SEARCH_TIMEOUT:-30}                  # 请求超时（秒）
  default_time_range: "${WEB_SEARCH_TIME_RANGE:-NoLimit}"     # NoLimit | OneDay | OneWeek | OneMonth | OneYear | YYYY-MM-DD..YYYY-MM-DD
  max_results: ${WEB_SEARCH_MAX_RESULTS:-10}                  # 每次返回条数（tavily 上限 20）
  main_text_max_chars: ${WEB_SEARCH_MAIN_TEXT_CHARS:-500}     # 单条结果摘要字符上限

# ===== 首页预置问题（每条一张卡片，最多 6 张）=====
preset_questions:
  - category: "宏观与资产研判"
    icon: "❄️"
    questions:
      - "结合国内外宏观指标判断增长与通胀方向，再落到 10 年期国债给出趋势研判与验证信号。"
  - category: "大类配置"
    icon: "📊"
    questions:
      - "基于最新 CMA 与当前持仓，在 PVBP、RWA 与分中心久期约束下测算目标持仓与约束。"
  - category: "组合管理"
    icon: "📄"
    questions:
      - "按信评、行业、期限、流动性与地域穿透信用债投组，标出久期集中区间与低流动性资产占比。"
  - category: "策略工坊"
    icon: "💻"
    questions:
      - "参考 XBOND 最优报价与经纪商跟随策略，新建一个债券日内做市策略并给出回测与验证方案。"
  - category: "因子工坊"
    icon: "📈"
    questions:
      - "围绕资金面、期限利差与机构行为挖掘利率债择时因子，并说明检验标准。"
  - category: "数据底座"
    icon: "🗄️"
    questions:
      - "调 USDCNH 近一周分钟 bar，算 5 分钟已实现波动率，并说明数据渠道与更新时点。"

# ===== 数据库 =====
database:
  type: "${DB_TYPE:-mysql}"                         # sqlite | mysql

  sqlite:
    path: "${SQLITE_PATH:-/qts/data/easy_agent.db}" # SQLite 文件路径

  mysql:
    host: "${MYSQL_HOST:-127.0.0.1}"
    port: ${MYSQL_PORT:-3306}
    user: "${MYSQL_USER:-root}"
    password: "${MYSQL_PASSWORD}"
    database: "${MYSQL_DATABASE:-easy_agent}"
    charset: "utf8mb4"
    pool:
      pool_size: ${MYSQL_POOL_SIZE:-5}    # 常驻连接数
      max_overflow: 10                    # 超出 pool_size 的临时连接数
      pool_recycle: 3600                  # 连接复用次数上限（DBUtils maxusage，非秒）
    connect_timeout: 10                   # 建立连接超时（秒）
    read_timeout: 30                      # 读超时（秒）
    write_timeout: 30                     # 写超时（秒）

# ===== HITL 审批 checkpoint =====
checkpoint:
  # 后端由 EASY_CHECKPOINT_BACKEND 选择：
  #   mysql_saver（生产多副本）—— 自研 AsyncMySQLSaver，全部 Pod 读写业务 MySQL 的 cp_* 表
  #   sqlite      —— 官方 AsyncSqliteSaver，本机文件，dev/test/单机 + 生产回滚
  #   legacy      —— 进程内 MemorySaver，仅供调试
  #   mysql       —— 已废弃别名，等同 mysql_saver（打一条 WARN）
  #   auto        —— 业务库是 MySQL 则 mysql_saver，否则 sqlite（只看配置，不探连通性）
  sqlite_path: "${CHECKPOINT_DIR:-/qts/checkpoint}/{pod}.db"

  # MySQL 共享后端（mysql_saver）。连接参数留空即复用 database.mysql.*，只需切后端名即可跑。
  mysql:
    enabled: true
    host: ""                                  # 留空 = 复用 database.mysql.host
    port: 0                                   # 0 = 复用业务库端口
    user: ""                                  # 留空 = 复用业务库账号
    password: ""                              # 留空 = 复用业务库密码
    database: ""                              # 留空 = 复用业务库库名（同库不同表）
    charset: utf8mb4                          # 必须 utf8mb4，中文表/列注释靠它
    table_prefix: "${CHECKPOINT_MYSQL_TABLE_PREFIX:-cp_}"   # 同库隔离靠前缀；不允许为空
    pool_min_size: 2
    pool_max_size: ${CHECKPOINT_MYSQL_POOL_MAX:-10}         # 多副本时总连接数 = Pod 数 × 本值
    connect_timeout: 5
    read_timeout: 10                          # 落服务端 max_execution_time（只对 SELECT）
    auto_setup: ${CHECKPOINT_MYSQL_AUTO_SETUP:-true}        # 启动时幂等建表/升级
    auto_setup_lock_wait: 60                  # 抢 GET_LOCK 建表锁的等待秒数；超时则启动失败
    gc_interval_seconds: ${EASY_CHECKPOINT_GC_INTERVAL:-600}  # 0 = 对账与 TTL 一起关
    record_ttl_days: ${CHECKPOINT_TTL_DAYS:-0}              # 0 = 不按时间过期（推荐）
    ttl_basis: session_updated_at             # session_updated_at | checkpoint_created_at
    ttl_only_archived: true                   # 只清已归档会话，避免"列表里有、点进去空"
    ttl_batch_size: 200
    ttl_protect_active_stream: true           # 有活跃流锁的 thread 一律跳过

# ===== 人员账号 =====
personnel:
  self_registration_enabled: false   # 自助注册：true 时登录页显示注册入口
  passwordless_login_enabled: false  # 门户免密登录：true 时支持 URL 直登与 /login-passwordless（admin 不支持）

# ===== 分布式锁（多实例部署）=====
distributed_lock:
  enabled: ${DISTRIBUTED_LOCK_ENABLED:-false}                  # 多 pod/多 worker 时开启，避免定时任务重复执行
  key_prefix: "${DISTRIBUTED_LOCK_KEY_PREFIX:-easy_agent}"     # 多套系统共库时用于区分
  ttl_seconds: ${DISTRIBUTED_LOCK_TTL:-300}                    # 锁存活时间（秒），持有者崩溃后最多等这么久
  renew_interval_seconds: ${DISTRIBUTED_LOCK_RENEW_INTERVAL:-100}  # 长任务续约间隔（秒），实际取 min(本值, ttl/3)
  retry_interval_seconds: ${DISTRIBUTED_LOCK_RETRY_INTERVAL:-1}    # 抢锁轮询间隔（秒）

# ===== 文件权限 =====
skill_write: ${SKILL_WRITE:-new-only}  # 技能库写权限：new-only（只可新建）| deny（全禁写）| allow（不限制）
interrupt_sensitive_writes: true       # /memories/**、/user-skills/** 的写入是否走人工审批（需 checkpointer）
denied_dirs: []                        # 禁读写的虚拟路径；字符串 = 读+写，{path, operations} = 仅指定操作

# ===== 人工审批（HITL）=====
hitl:
  enabled: true                  # false：对话里也不审批（和定时任务一样），也不提供创建定时任务的工具
  # 执行这些工具前要人工审批；不写 tools 时就是下面这份默认名单
  tools:
    - execute                    # 只拦删除类命令（rm / unlink / shred 等），删目录直接拒绝
    - delete                     # 删除文件或目录（删目录只走这里，用户批准后执行）
    - save_expert                # 新建 / 修改专家
    - create_scheduled_task      # 创建定时任务
    - access_knowledge_original  # 只拦 action=materialize（把知识库原文取到工作区）
  # MCP 工具写工具名即可（带不带服务前缀都行）；没列出的 MCP 工具仍按服务端标注 / 名字自动判断

# ===== 专家 =====
expert:
  guardrail_enabled: true            # 在专家提示词末尾追加职责边界
  relevance_check_enabled: true      # 每轮预检相关性，无关消息直接拒答
  relevance_strict: false            # true = 部分相关也整条拒答；false = 放行只答相关部分
  relevance_disable_thinking: true   # 预检调用关闭思考模式
  auto_install_required_skills: true # 用预置专家时自动「添加」其 required_skills 声明的公共技能（不复制技能包）
  tool_scope_enabled: true           # 专家选定技能包时做硬隔离：只挂这些技能 + 本轮另选的技能；未选=全量可见

# ===== 专家分类标签（tag_id 落库，tag_name 展示）=====
expert_tags:
  - { tag_id: macro_research, tag_name: 宏观投研 }
  - { tag_id: bond_research, tag_name: 债券投研 }
  - { tag_id: fx_research, tag_name: 外汇投研 }
  - { tag_id: gold_research, tag_name: 黄金投研 }
  - { tag_id: alm_calc, tag_name: 资负测算 }
  - { tag_id: strategy_research, tag_name: 策略研究 }
  - { tag_id: factor_analysis, tag_name: 因子分析 }
  - { tag_id: equity_research, tag_name: 权益投研 }
  - { tag_id: industry_research, tag_name: 行业研究 }
  - { tag_id: credit_research, tag_name: 信用研究 }
  - { tag_id: asset_allocation, tag_name: 资产配置 }
  - { tag_id: risk_management, tag_name: 风险管理 }
  - { tag_id: business_analysis, tag_name: 经营分析 }
  - { tag_id: other, tag_name: 其他 }

# ===== 附件上传限额（单个会话单次对话）=====
upload_limits:
  enabled: ${UPLOAD_LIMITS_ENABLED:-true}            # false = 不限制
  max_file_size_mb: ${UPLOAD_MAX_FILE_SIZE_MB:-10}   # 单文件上限
  max_files_per_message: ${UPLOAD_MAX_FILES:-5}      # 单次数量上限
  max_total_size_mb: ${UPLOAD_MAX_TOTAL_SIZE_MB:-20} # 单次总大小上限（>100 需同步 nginx client_max_body_size）

# ===== 上传文件解析与记忆（file_context）=====
file_context:
  enabled: ${FILE_CONTEXT_ENABLED:-true}                     # false = 回退全量注入
  parse_max_file_size_mb: ${FILE_PARSE_MAX_MB:-20}           # 超过该大小不解析，仍记清单
  max_stored_chars: ${FILE_MAX_STORED_CHARS:-200000}         # 单文件落盘文本上限（字符）
  manifest_max_chars: ${FILE_MANIFEST_MAX_CHARS:-2000}       # 上传清单上限，超出丢最旧条目
  preview_max_chars: ${FILE_PREVIEW_MAX_CHARS:-2000}         # 本轮预览注入上限（0 = 不注入）

# ===== 知识库 / RAGFlow（接入、研报同步与研报 SQL 可用环境变量覆盖；入库/检索参数在此配置）=====
knowledge:
  enabled: ${KNOWLEDGE_ENABLED:-false}                   # 启用前需配置 RAGFLOW_BASE_URL / RAGFLOW_API_KEY
  base_url: "${RAGFLOW_BASE_URL}"
  api_key: "${RAGFLOW_API_KEY}"
  shared_dataset_id: "${RAGFLOW_SHARED_DATASET_ID:-}"    # 留空按 EA_SHARED 名称查找或创建
  # 审计事件记录开关与 details 截断上限
  audit:
    enabled: true              # 记录知识库审计事件
    max_details_bytes: 4096    # 事件 details 截断上限
  # 入库参数：上传限额 / 解析超时 / 检索文档范围
  limits:
    max_file_size_mb: 100
    max_request_size_mb: 110
    max_filename_utf8_bytes: 127
    # 逗号分隔的后缀白名单（不含点），如 pdf,docx,txt
    allowed_extensions: "pdf,doc,docx,txt,md,xls,xlsx,csv"
    # 存量 document_ids 检索模式的单次范围上限（回填 base_id 元数据后不再受此限制）
    max_documents_per_query: 500
    # 单个知识库可存储的文档总数上限（上传前拦截）。0 = 不限制。
    max_documents_per_base: 0
    # 解析绝对超时（秒）：0 = 不限制；计时从真正开始解析算起，不含上游排队
    parse_timeout_seconds: 0
  # 检索参数（全局生效）：先宽召回 page_size 条候选，rerank 精排后只取 top_n 条证据
  retrieval:
    similarity_threshold: 0.5  # 主阈值：低于该分不进入证据
    fallback_similarity_threshold: 0.4  # 主阈值无命中时的降级阈值
    aggregation_similarity_threshold: 0.4  # 计数/汇总类问题的召回阈值
    minimum_evidence_score: 0.4  # 本地兜底过滤：低于该分直接丢弃
    vector_similarity_weight: 0.5  # 向量/关键词混合权重（0=纯关键词，1=纯向量）
    top_k: 1024                # rerank 前参与打分的候选 chunk 数
    page_size: 30              # 检索接口返回的候选条数（宽召回）
    rerank_model: "${RAGFLOW_RERANK_MODEL:-}"  # 格式 model_name@factory；留空 = 不启用 rerank
    per_base_quota: 2          # 每个知识库至少保留的证据条数（0=不做配额）
    top_n: 8                   # 单轮最终进入提示词的证据条数
  # 研报接入：文档 SQL 增量同步（enabled=true 即启用；mysql 连接/表名按需填写）
  source_sync:
    enabled: ${KNOWLEDGE_SOURCE_SYNC_ENABLED:-false}
    owner_username: "${KNOWLEDGE_SOURCE_SYNC_OWNER_USERNAME:-admin}"  # 入库归属用户（需已存在，以该用户身份上传并授权）
    file_root: "${SOURCE_SYNC_FILE_ROOT:-}"  # 源目录（绝对路径，必填）：按文档 SQL 的 batchid 在此目录下匹配同名文件
    staging_dir: "${SOURCE_SYNC_STAGING_DIR:-}"  # 暂存目录（绝对路径，可选）：先把本批文件拷贝到这里（同名文件直接覆盖），READY 后删除暂存副本；留空=直接读源目录
    staging_retention_hours: ${KNOWLEDGE_SOURCE_SYNC_STAGING_RETENTION_HOURS:-24}  # 暂存残留清理阈值（小时）：每轮同步开始时清理超过该时长的残留文件
    base_id: "${KNOWLEDGE_SOURCE_SYNC_BASE_ID:-}"  # 精确指定入库的知识库 ID（同名库有多个时用它锁定）；留空则按 base_name 查找/新建
    base_name: "${KNOWLEDGE_SOURCE_SYNC_BASE_NAME:-报告库}"  # 按这个名字找知识库，找不到才新建（新建固定为团队公共库）；base_id 为空时生效
    lookback_days: ${KNOWLEDGE_SOURCE_SYNC_LOOKBACK_DAYS:-7}  # 按 publishDate 取最近 N 天
    start_time: "${KNOWLEDGE_SOURCE_SYNC_START_TIME:-}"  # 首次触发时间 HH:MM:SS（24 小时制，服务器本地时间）；仅首次生效，之后按 interval_minutes 触发；留空=启动即执行
    interval_minutes: ${KNOWLEDGE_SOURCE_SYNC_INTERVAL_MINUTES:-60}  # 固定间隔触发（按首次执行时刻对齐，不等待上一轮解析完成；超时跳过错过点）；0 = 只执行一次
    max_inflight: ${KNOWLEDGE_SOURCE_SYNC_MAX_INFLIGHT:-10}  # 同时在途（排队/解析中）文档上限
    mysql:
      host: "${COL_SQL_HOST:-}"         # 研报 SQL 必填，不复用主库
      port: ${COL_SQL_PORT:-3306}
      user: "${COL_SQL_USER:-}"
      password: "${COL_SQL_PASSWORD:-}"
      database: "${COL_SQL_DB:-}" # 研报 SQL 必填，不复用主库
      charset: "${COL_SQL_CHARSET:-utf8mb4}"
      table: "${COL_SQL_TABLE:-}"       # 研报源表名（必填，源库已存在）

