name: easyagent-local

services:
  mysql:
    image: mysql:8.4
    container_name: easyagent-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${EASYAGENT_MYSQL_ROOT_PASSWORD:-easyagent_root_dev_only}"
      MYSQL_DATABASE: "${EASYAGENT_MYSQL_DATABASE:-agent}"
      MYSQL_USER: "${EASYAGENT_MYSQL_USER:-easyagent}"
      MYSQL_PASSWORD: "${EASYAGENT_MYSQL_PASSWORD:-easyagent_dev_only}"
      TZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "127.0.0.1:${EASYAGENT_MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - easyagent_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysqladmin ping
          --host=127.0.0.1 --user="$${MYSQL_USER}" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  easyagent_mysql_data:
    name: easyagent_mysql_data
