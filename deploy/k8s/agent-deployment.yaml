# Single-pod Easy Agent. Requires MySQL (application database) and RWX workspace storage.
#
# HITL checkpoints use the official SQLite saver: data/checkpoints.db on the pod's
# local `data` volume. The LangGraph Store lives in MySQL (SqlStore). Postgres support
# was removed (production has MySQL only), and no checkpointer can be shared across
# pods, so keep replicas at 1: in prod the app refuses to start when
# EASY_REPLICA_COUNT is above 1. Never put the SQLite file on the NAS: SQLite's WAL
# mode does not work on network filesystems.
apiVersion: v1
kind: ConfigMap
metadata:
  name: easy-agent-config
data:
  AGENT_ENV: "prod"
  # Must match spec.replicas below: detect_worker_count() reads this value, and a
  # prod deployment fails fast when it is above 1.
  EASY_REPLICA_COUNT: "1"
  EASY_TRUST_PROXY: "1"
  EASY_SKIP_LLM_PROBE: "1"
  EASY_CHECKPOINT_BACKEND: "auto"
  # Resolved against the repo root (/app), i.e. the local `data` volume below.
  EASY_CHECKPOINT_SQLITE_PATH: "data/checkpoints.db"
  # Explicitly off: prod refuses to run more than one replica.
  EASY_ALLOW_LEGACY_CHECKPOINTER: "0"
  # Phase 0：SSE/run/file/sandbox 尚未外置，保持 0；Phase 2/3 完成后再改 1。
  EASY_MULTI_REPLICA_STRICT: "0"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: easy-agent-workspace
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: easy-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: easy-agent
  template:
    metadata:
      labels:
        app: easy-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: easy-agent
          image: easy-agent:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: easy-agent-config
            - secretRef:
                name: easy-agent-secrets
          env:
            - name: EASY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: easy-agent-secrets
                  key: jwt-secret
            - name: EASY_CORS_ALLOW_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: easy-agent-secrets
                  key: cors-origins
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              add: ["SYS_ADMIN"]
              drop: ["ALL"]
          volumeMounts:
            - name: shared
              mountPath: /app/workspace
              subPath: workspace
            - name: shared
              mountPath: /app/memories
              subPath: memories
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /api/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: easy-agent-workspace
        # Pod-local, not the NAS: holds the SQLite checkpoint file. emptyDir is wiped
        # when the pod is replaced, which drops approvals that were still pending; use a
        # ReadWriteOnce block-storage PVC instead if they must survive restarts.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: easy-agent
spec:
  selector:
    app: easy-agent
  ports:
    - port: 80
      targetPort: 8000
