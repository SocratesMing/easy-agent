# Multi-replica Easy Agent. Requires MySQL (application database), RWX workspace
# storage, and the sticky-session Ingress in agent-ingress.yaml.
#
# HITL checkpoints live in shared MySQL tables (cp_checkpoints / cp_checkpoint_blobs /
# cp_checkpoint_writes / cp_checkpoint_meta, created automatically at startup by
# AsyncMySQLSaver.asetup with a GET_LOCK-guarded DDL), so approvals survive Pod
# replacement and can resume on any replica. Chat threads are shared the same way.
# The LangGraph Store also lives in MySQL (SqlStore).
apiVersion: v1
kind: ConfigMap
metadata:
  name: easy-agent-config
data:
  AGENT_ENV: "prod"
  # Must match spec.replicas below: the startup check reads this value to know the
  # deployment runs several pods.
  EASY_REPLICA_COUNT: "2"
  EASY_TRUST_PROXY: "1"
  EASY_SKIP_LLM_PROBE: "1"
  # Shared MySQL checkpointer (self-hosted AsyncMySQLSaver) preserves pending HITL
  # approvals and chat threads across Pod replacement. "mysql" is a deprecated alias
  # kept only so old ConfigMaps keep working; write mysql_saver from now on.
  EASY_CHECKPOINT_BACKEND: "mysql_saver"
  # Sticky sessions are no longer required (any Pod can resume any thread), but keep
  # the Ingress annotation: it is the rollback path to the sqlite backend.
  EASY_STICKY_SESSIONS: "1"
  # Seconds between background passes: (1) reconcile threads of deleted sessions,
  # (2) expire threads by age when record_ttl_days > 0 (0 = disabled, recommended).
  EASY_CHECKPOINT_GC_INTERVAL: "600"
  # 0 = never expire by age. >0 deletes whole threads (not single checkpoints).
  CHECKPOINT_TTL_DAYS: "0"
  # Same-instance table prefix; raise it to isolate several environments in one database.
  CHECKPOINT_MYSQL_TABLE_PREFIX: "cp"
  # Scheduled tasks run on one pod only (the scheduler refuses to register them otherwise).
  DISTRIBUTED_LOCK_ENABLED: "true"
  # Uploaded files go to MySQL instead of the pod-local data/uploads.
  EASY_UPLOAD_BACKEND: "store"
  # Explicitly off: the escape hatch that would accept inconsistent cross-pod approvals.
  EASY_ALLOW_LEGACY_CHECKPOINTER: "0"
  # Phase 0：SSE/run/file/sandbox 尚未外置，保持 0；Phase 2/3 完成后再改 1。
  EASY_MULTI_REPLICA_STRICT: "0"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: easy-agent-workspace
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: easy-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: easy-agent
  template:
    metadata:
      labels:
        app: easy-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: easy-agent
          image: easy-agent:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: easy-agent-config
            - secretRef:
                name: easy-agent-secrets
          env:
            # Instance name for {pod} in the checkpoint path and for pending approvals.
            - name: EASY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: EASY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: easy-agent-secrets
                  key: jwt-secret
            - name: EASY_CORS_ALLOW_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: easy-agent-secrets
                  key: cors-origins
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              add: ["SYS_ADMIN"]
              drop: ["ALL"]
          volumeMounts:
            - name: shared
              mountPath: /app/workspace
              subPath: workspace
            - name: shared
              mountPath: /app/memories
              subPath: memories
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /api/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: easy-agent-workspace
        # Pod-local scratch space for the repo's data/ directory.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: easy-agent
spec:
  selector:
    app: easy-agent
  ports:
    - port: 80
      targetPort: 8000
