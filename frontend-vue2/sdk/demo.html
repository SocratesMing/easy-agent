<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>订单管理 · Easy Agent 侧边栏接入示例</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f5f6f8; color: #222; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: #1f2937; color: #fff; }
    main { padding: 24px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #eee; text-align: left; }
    button { padding: 6px 12px; border: 1px solid #d0d5dd; border-radius: 6px; background: #fff; cursor: pointer; }
    .tips { margin: 16px 0; color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <strong>某业务系统 · 订单管理</strong>
    <span>
      <button id="ask">让 AI 分析本页订单</button>
      <button id="toggle">打开 / 关闭 AI</button>
    </span>
  </header>
  <main>
    <p class="tips">
      这是第三方页面接入示例：右侧「问 AI」按钮唤起侧边栏，选中下面表格中的文字可「划词提问」。
      地址栏参数：?baseURL=后端地址&amp;username=免密用户名（或 &amp;token=xxx）
    </p>
    <table id="orders">
      <thead><tr><th>订单号</th><th>客户</th><th>金额</th><th>状态</th></tr></thead>
      <tbody>
        <tr><td>SO-20261001</td><td>华东某科技</td><td>¥ 128,000</td><td>待发货</td></tr>
        <tr><td>SO-20261002</td><td>西南某制造</td><td>¥ 56,300</td><td>已逾期</td></tr>
        <tr><td>SO-20261003</td><td>华北某零售</td><td>¥ 9,800</td><td>已完成</td></tr>
      </tbody>
    </table>
  </main>

  <!-- 1. 引入 SDK（单文件，CSS 已内联） -->
  <script src="./easy-agent-sidebar.umd.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search)

    // 2. 初始化
    const sidebar = EasyAgentSidebar.init({
      baseURL: params.get('baseURL') || 'http://localhost:8080',
      auth: params.get('token')
        ? { token: params.get('token') }
        : { username: params.get('username') || 'sdk_demo', userId: '0' },
      mainAppUrl: params.get('mainAppUrl') || undefined,
      // 3. 页面上下文：每次打开侧边栏时调用，随消息提供给 AI
      pageContext: () => ({
        key: 'orders',
        title: '订单管理',
        description: '用户正在查看订单列表，可进行发货、催款等操作',
        suggestions: ['哪些订单需要优先处理？', '汇总本页订单金额', '给逾期客户写一封催款邮件'],
        content: Array.from(document.querySelectorAll('#orders tbody tr'))
          .map(tr => Array.from(tr.cells).map(td => td.textContent).join(' | '))
          .join('\n'),
      }),
      onReady: () => console.log('[demo] 侧边栏就绪'),
      onError: (e) => alert('AI 侧边栏初始化失败：' + e.message),
    })

    // 4. 业务按钮直接调用实例方法
    document.getElementById('ask').onclick = () => sidebar.send('分析本页订单，指出风险并给出处理建议')
    document.getElementById('toggle').onclick = () => sidebar.toggle()
  </script>
</body>
</html>
