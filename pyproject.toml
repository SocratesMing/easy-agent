[project]
name = "wukong-agent"
version = "0.1.0"
description = "AI agent powered by DeepAgents framework with Mini-Agent's configuration and interaction patterns"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Wukong Agent Team"}
]
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "deepagents>=0.1.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
wukong-agent = "wukong_agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["wukong_agent*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
