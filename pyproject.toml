[project]
name = "easy-agent"
version = "0.1.0"
description = "AI agent powered by DeepAgents framework with Mini-Agent's configuration and interaction patterns"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Easy Agent Team"}
]
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "deepagents>=0.1.0",
    "langchain>=1.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pymysql>=1.1.0",
    "DBUtils>=3.0.0",
    "bcrypt>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
    "schedule>=1.2.0",
    "apscheduler>=3.10.0,<4.0.0",
    "langchain-mcp-adapters>=0.1.0",
]

[project.scripts]
easy-web = "easy_agent.web_runner:run_web"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
docs = [
    "python-docx>=1.0.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.0.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "pdfminer.six>=20231228",
    "pytesseract>=0.3.0",
    "Pillow>=10.0.0",
    "xlrd>=2.0.0",
    "striprtf>=0.0.30",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["easy_agent*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
