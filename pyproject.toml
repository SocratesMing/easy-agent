[project]
name = "easy-agent"
version = "0.1.0"
description = "AI agent powered by DeepAgents framework with Mini-Agent's configuration and interaction patterns"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Easy Agent Team"}
]
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "deepagents>=0.7.28,<0.8",
    "langchain>=1.4.6,<1.5",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0,<1",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "openpyxl>=3.0.0",
    "pymysql>=1.1.0",
    "DBUtils>=3.0.0",
    "bcrypt>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
    "schedule>=1.2.0",
    "apscheduler>=3.10.0,<4.0.0",
    "langchain-mcp-adapters>=0.1.0",
    # 生产 HITL checkpointer（官方 AsyncSqliteSaver）；不能放在可选依赖里，否则镜像和 CI 都装不上
    "langgraph-checkpoint-sqlite>=3.1.2",
]

[project.scripts]
easy-web = "easy_agent.bootstrap.web_runner:run_web"
# NOTE: 历史上的 easy-knowledge-worker 指向不存在的 easy_agent.knowledge.worker，
# 已移除；知识库 worker 由应用 lifespan（knowledges.runtime.lifecycle）托管。

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
docs = [
    "python-docx>=1.0.0",
    "python-pptx>=1.0.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "pdfminer.six>=20231228",
    "pytesseract>=0.3.0",
    "Pillow>=10.0.0",
    "xlrd>=2.0.0",
    "striprtf>=0.0.30",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["easy_agent*"]
exclude = ["tests*"]

# 包内运行时资源（配置模板、提示词片段、静态资源）必须随 wheel 安装，
# 否则 pip 安装场景启动时会退化为内置默认提示词 / 找不到配置。
[tool.setuptools.package-data]
easy_agent = [
    "config/*.yaml",
    "config/*.json",
    "config/**/*.md",
    "prompts/**/*.md",
    "static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 未知 marker 视为错误（防止 pytest.mark.sikp 之类的拼写错误被静默忽略）
addopts = "--strict-markers"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]


# Ruff 配置：先只拦「语法错误 / 未定义名 / 失效导入」等致命问题，
# 风格类规则（E402/F401/F841 等现存 50+）按审计 ARCH-19 分阶段治理。
[tool.ruff]
target-version = "py311"
line-length = 100
respect-gitignore = true
exclude = ["easy_agent/skills/**", "easy_agent/static/**", ".venv", "_analysis"]

[tool.ruff.lint]
# E9: 语法/IO 错误；F63/F7/F82: 无效比较、语法错误、未定义名。
# 这些规则命中即代表运行期必坏，不会产生“风格债”噪音。
select = ["E9", "F63", "F7", "F82"]
